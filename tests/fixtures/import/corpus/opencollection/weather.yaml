opencollection: 1.0.0
bundled: true
info:
  name: Weather API
request:
  auth:
    type: apikey
    key: appid
    value: "{{appid}}"
    placement: query
  variables:
    - name: baseUrl
      value: https://api.weather.example.test/data/2.5
items:
  - info:
      name: Current
      type: folder
      seq: 1
    items:
      - info:
          name: Current weather by city
          type: http
          seq: 1
        http:
          method: GET
          url: "{{baseUrl}}/weather"
          params:
            - name: q
              value: London,uk
              type: query
            - name: units
              value: metric
              type: query
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: "200"
      - info:
          name: Current weather by coordinates
          type: http
          seq: 2
        http:
          method: GET
          url: "{{baseUrl}}/weather"
          params:
            - name: lat
              value: "51.5"
              type: query
            - name: lon
              value: "-0.12"
              type: query
      - info:
          name: Current weather by zip
          type: http
          seq: 3
        http:
          method: GET
          url: "{{baseUrl}}/weather"
          params:
            - name: zip
              value: 94040,us
              type: query
  - info:
      name: Forecast
      type: folder
      seq: 2
    items:
      - info:
          name: 5 day forecast
          type: http
          seq: 1
        http:
          method: GET
          url: "{{baseUrl}}/forecast"
          params:
            - name: q
              value: Paris
              type: query
            - name: cnt
              value: "40"
              type: query
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: "200"
      - info:
          name: Air pollution
          type: http
          seq: 2
        http:
          method: GET
          url: "{{baseUrl}}/air_pollution"
          params:
            - name: lat
              value: "50"
              type: query
            - name: lon
              value: "50"
              type: query
      - info:
          name: Weather alerts
          type: http
          seq: 3
        http:
          method: GET
          url: "{{baseUrl}}/onecall"
          params:
            - name: lat
              value: "33.44"
              type: query
            - name: lon
              value: "-94.04"
              type: query
            - name: exclude
              value: minutely,hourly
              type: query
config:
  environments:
    - name: default
      variables:
        - name: baseUrl
          value: https://api.weather.example.test/data/2.5
        - name: appid
          value: demo
