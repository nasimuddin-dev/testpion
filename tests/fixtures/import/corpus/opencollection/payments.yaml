opencollection: 1.0.0
bundled: true
info:
  name: Payments API
request:
  auth:
    type: bearer
    token: "{{secretKey}}"
  variables:
    - name: baseUrl
      value: https://api.payments.example.test/v1
items:
  - info:
      name: Customers
      type: folder
      seq: 1
    items:
      - info:
          name: Create a customer
          type: http
          seq: 1
        http:
          method: POST
          url: "{{baseUrl}}/customers"
          body:
            type: form-urlencoded
            data:
              - name: email
                value: jenny@example.test
              - name: name
                value: Jenny Rosen
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: "200"
      - info:
          name: Retrieve a customer
          type: http
          seq: 2
        http:
          method: GET
          url: "{{baseUrl}}/customers/cus_123"
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: "200"
      - info:
          name: Update a customer
          type: http
          seq: 3
        http:
          method: POST
          url: "{{baseUrl}}/customers/cus_123"
          body:
            type: form-urlencoded
            data:
              - name: description
                value: VIP
      - info:
          name: Delete a customer
          type: http
          seq: 4
        http:
          method: DELETE
          url: "{{baseUrl}}/customers/cus_123"
      - info:
          name: List all customers
          type: http
          seq: 5
        http:
          method: GET
          url: "{{baseUrl}}/customers"
          params:
            - name: limit
              value: "10"
              type: query
            - name: starting_after
              value: cus_100
              type: query
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: "200"
  - info:
      name: Charges
      type: folder
      seq: 2
    items:
      - info:
          name: Create a charge
          type: http
          seq: 1
        http:
          method: POST
          url: "{{baseUrl}}/charges"
          headers:
            - name: Idempotency-Key
              value: "{{$guid}}"
          body:
            type: form-urlencoded
            data:
              - name: amount
                value: "2000"
              - name: currency
                value: usd
              - name: source
                value: tok_visa
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: "200"
      - info:
          name: Retrieve a charge
          type: http
          seq: 2
        http:
          method: GET
          url: "{{baseUrl}}/charges/ch_123"
      - info:
          name: Capture a charge
          type: http
          seq: 3
        http:
          method: POST
          url: "{{baseUrl}}/charges/ch_123/capture"
      - info:
          name: List all charges
          type: http
          seq: 4
        http:
          method: GET
          url: "{{baseUrl}}/charges"
          params:
            - name: customer
              value: cus_123
              type: query
  - info:
      name: Refunds
      type: folder
      seq: 3
    items:
      - info:
          name: Create a refund
          type: http
          seq: 1
        http:
          method: POST
          url: "{{baseUrl}}/refunds"
          body:
            type: form-urlencoded
            data:
              - name: charge
                value: ch_123
              - name: amount
                value: "500"
      - info:
          name: Retrieve a refund
          type: http
          seq: 2
        http:
          method: GET
          url: "{{baseUrl}}/refunds/re_123"
      - info:
          name: List all refunds
          type: http
          seq: 3
        http:
          method: GET
          url: "{{baseUrl}}/refunds"
          params:
            - name: charge
              value: ch_123
              type: query
config:
  environments:
    - name: test
      variables:
        - name: baseUrl
          value: https://api.payments.example.test/v1
        - name: secretKey
          value: sk_test_0000
    - name: live
      variables:
        - name: baseUrl
          value: https://api.payments.example.test/v1
        - name: secretKey
          value: ""
