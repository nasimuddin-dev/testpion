# Installers for Windows, macOS and Linux (electron-builder).
# Asset names are stable so the website and README can link to them:
#   TestPion-<version>-windows-x64-setup.exe     Windows installer (NSIS)
#   TestPion-<version>-windows-x64-portable.exe  Windows portable (no install)
#   TestPion-<version>-macos-arm64.dmg            Apple Silicon
#   TestPion-<version>-macos-x64.dmg              Intel
#   TestPion-<version>-linux-x86_64.AppImage
#   TestPion-<version>-linux-amd64.deb
#   TestPion-<version>-linux-x86_64.rpm
# kept from the first name (Protolens) so installed copies update in place and keep their settings
appId: dev.nasimuddin.protolens
productName: TestPion
copyright: Copyright © 2026 TestPion contributors
electronVersion: 44.4.5
directories:
  output: release
  buildResources: build
# The main process bundles the whole engine (esbuild), so no node_modules are shipped.
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"
  - "!dist-electron/web-server.cjs"
  - package.json
asar: true
# The examples workspace (public APIs, every protocol): copied into the user's data folder and opened on first launch.
extraResources:
  # the window icon (Linux and macOS windows; Windows also takes it from the .exe)
  - from: build/icons/256x256.png
    to: icon.png
  - from: ../../examples/public-workspace
    to: examples/public-workspace
    filter:
      - "**/*"
      - "!runs/**"
      - "!traces/**"
      - "!payloads/**"
      - "!reports/**"
      - "!baselines/**"
      - "!database.sqlite*"
      - "!metadata.jsonl"
npmRebuild: false
# Electron fuses, set in the packaged binary: the installed app can't be turned into a general Node.js
# runtime or a debug target by whoever can start it with an environment variable or a flag.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  # macOS builds are ad-hoc signed: the signature is redone after the fuses change the binary
  resetAdHocDarwinSignature: true
# Auto-update source (electron-updater). Builds use --publish never; the release workflow uploads
# the installers plus latest.yml / latest-linux.yml and the .blockmap files to the GitHub Release.
publish:
  - provider: github
    owner: nasimuddin-dev
    repo: testpion
    releaseType: release
extraMetadata:
  # boot.cjs turns on V8's compile cache and loads main.cjs
  main: dist-electron/boot.cjs
  # package / executable name on Linux (.deb, .rpm, binary); the display name stays "TestPion"
  name: testpion

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # multi-size icon (16–256 px) generated by `npm run icons` from build/logo/testpion-NxN.png (the TP test-tube mark)
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TestPion
  # the TestPion wordmark in the installer header and on the welcome/finish pages (generated by `npm run icons`)
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  artifactName: TestPion-${version}-windows-${arch}-setup.${ext}
portable:
  artifactName: TestPion-${version}-windows-${arch}-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Unsigned builds are ad-hoc signed so they run on Apple Silicon; notarization needs an Apple ID.
  identity: "-"
  hardenedRuntime: false
  artifactName: TestPion-${version}-macos-${arch}.${ext}
dmg:
  title: TestPion ${version}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Development
  executableName: testpion
  # icon set build/icons/NxN.png (16–512 px) generated by `npm run icons`
  icon: build/icons
  maintainer: TestPion contributors <noreply@github.com>
  synopsis: Test and debug REST, GraphQL, MCP and AI systems
  description: Local-first desktop app for testing, debugging and evaluating REST, GraphQL and WebSocket APIs, MCP servers, LLM APIs, RAG pipelines and AI agents.
appImage:
  artifactName: TestPion-${version}-linux-x86_64.${ext}
deb:
  artifactName: TestPion-${version}-linux-amd64.${ext}
rpm:
  artifactName: TestPion-${version}-linux-x86_64.${ext}
