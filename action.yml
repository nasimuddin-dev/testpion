# Run a TestPion workspace's tests in GitHub Actions:
#
#   - uses: nasimuddin-dev/testpion@v0.43.0
#     with:
#       workspace: api-tests          # the folder with workspace.json (default: the repository root)
#       suite: integration            # or collection: "My API" / tests: rest
#       environment: Staging
#       start: npm start              # integration tests: start the system under test first (optional)
#       wait-for: http://127.0.0.1:3000/health
#       triage: true                  # on failures: group them by cause (and explain them with an AI model, if set up) in the job summary
#
# A RAG evaluation instead (its metrics and gates, a JUnit and HTML report; the judge model's key is a secret):
#       rag-evaluation: Clinic RAG
#       preset: rag-triad
#       min: faithfulness=0.8 recall@5=0.9
#       baseline: run-abc123
#       max-cost: '2'
#     env:
#       TESTPION_SECRET_ENV_STAGING_APIKEY: ${{ secrets.STAGING_API_KEY }}   # secret variables, named by `testpion ci`
#
# Reports (JUnit, HTML, Markdown, console) land in `test-results/` and are uploaded as an artifact; the Markdown report (and the
# triage, with `triage: true`) is also the job summary; a failing test fails the job.
name: TestPion tests
description: Run a TestPion workspace's tests (REST, GraphQL, gRPC, WebSocket, MCP, AI) and publish the reports.
author: TestPion
branding:
  icon: check-circle
  color: blue
inputs:
  workspace:
    description: The workspace folder, relative to the repository root (the folder with workspace.json).
    default: '.'
  suite:
    description: 'A suite to run: tests/<suite>.suite.yaml.'
    default: ''
  collection:
    description: A collection to run (name or id), instead of a suite.
    default: ''
  folder:
    description: With collection, only this folder or request.
    default: ''
  tests:
    description: 'Test files or folders under tests/ to run (space separated), instead of a suite; default: all.'
    default: ''
  environment:
    description: The environment to run with.
    default: ''
  allow-production:
    description: 'Data-changing requests may go to an environment marked as production (true/false; adds --allow-production).'
    default: 'false'
  start:
    description: 'Integration tests: a command that starts the system under test, run in the background before the tests.'
    default: ''
  wait-for:
    description: 'With start: a URL polled until it answers (the health check).'
    default: ''
  wait-seconds:
    description: How long to wait for it.
    default: '90'
  out:
    description: Where the reports go.
    default: test-results
  triage:
    description: 'After a failed run, group the failures by likely cause (and, with an AI model set up, explain them) in triage.md and the job summary (true/false; adds --triage).'
    default: 'false'
  rag-evaluation:
    description: 'A saved RAG evaluation to run instead of tests (`testpion rag run`): the questions go to the RAG system and are scored by the metrics; a failed gate fails the job.'
    default: ''
  preset:
    description: 'With rag-evaluation: a metric preset (rag-triad, ragas-core, deepeval-rag, nvidia-rag, retrieval-only, free …) replacing the evaluation''s metrics.'
    default: ''
  judge:
    description: 'With rag-evaluation: the judge as provider/model (default: the evaluation''s, else TESTPION_AI_PROVIDER / TESTPION_AI_MODEL).'
    default: ''
  min:
    description: 'With rag-evaluation: gates, space separated metric=value (the mean must reach it), e.g. "faithfulness=0.8 recall@5=0.9".'
    default: ''
  baseline:
    description: 'With rag-evaluation: a run id to compare with, metric by metric; a real regression fails the job.'
    default: ''
  max-cost:
    description: 'With rag-evaluation: stop judging once this much (USD) is spent; the rest is n/a.'
    default: ''
  upload:
    description: Upload the reports as an artifact (true/false).
    default: 'true'
  node-version:
    description: Node.js version for the CLI.
    default: '24'
outputs:
  results:
    description: The folder with the reports (junit.xml, report.html, results.jsonl).
    value: ${{ inputs.out }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install the TestPion CLI
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci --no-audit --no-fund --ignore-scripts
        npm run build -w @testpion/shared -w @testpion/core -w @testpion/cli
    - name: Start the system under test
      if: inputs.start != ''
      shell: bash
      run: |
        (${{ inputs.start }}) &
        if [ -n "${{ inputs.wait-for }}" ]; then node "${{ github.action_path }}/packages/cli/bin/testpion.js" wait-for "${{ inputs.wait-for }}" --timeout "${{ inputs.wait-seconds }}"; fi
    - name: Run the tests
      shell: bash
      run: |
        CLI="${{ github.action_path }}/packages/cli/bin/testpion.js"
        ENV=""; [ -n "${{ inputs.environment }}" ] && ENV="-e ${{ inputs.environment }}"
        PROD=""; [ "${{ inputs.allow-production }}" = "true" ] && PROD="--allow-production"
        TRIAGE=""; [ "${{ inputs.triage }}" = "true" ] && TRIAGE="--triage"
        if [ -n "${{ inputs.rag-evaluation }}" ]; then
          RAG=""
          [ -n "${{ inputs.preset }}" ] && RAG="$RAG --preset ${{ inputs.preset }}"
          [ -n "${{ inputs.judge }}" ] && RAG="$RAG --judge ${{ inputs.judge }}"
          [ -n "${{ inputs.baseline }}" ] && RAG="$RAG --baseline ${{ inputs.baseline }}"
          [ -n "${{ inputs.max-cost }}" ] && RAG="$RAG --max-cost ${{ inputs.max-cost }}"
          for g in ${{ inputs.min }}; do RAG="$RAG --min $g"; done
          node "$CLI" rag run "${{ inputs.rag-evaluation }}" -w "${{ inputs.workspace }}" $ENV $RAG -o "${{ inputs.out }}" --junit "${{ inputs.out }}/junit.xml" --html "${{ inputs.out }}/report.html"
        elif [ -n "${{ inputs.collection }}" ]; then
          FOLDER=""; [ -n "${{ inputs.folder }}" ] && FOLDER="--folder ${{ inputs.folder }}"
          node "$CLI" run-collection "${{ inputs.collection }}" -w "${{ inputs.workspace }}" $ENV $FOLDER -r console junit html markdown -o "${{ inputs.out }}" $PROD $TRIAGE
        elif [ -n "${{ inputs.suite }}" ]; then
          node "$CLI" run -w "${{ inputs.workspace }}" --suite "${{ inputs.suite }}" $ENV -r console junit html markdown -o "${{ inputs.out }}" $PROD $TRIAGE
        else
          PATHS=""; for t in ${{ inputs.tests }}; do PATHS="$PATHS ${{ inputs.workspace }}/tests/$t"; done
          [ -z "$PATHS" ] && PATHS="${{ inputs.workspace }}/tests"
          node "$CLI" test $PATHS -w "${{ inputs.workspace }}" $ENV -r console junit html markdown -o "${{ inputs.out }}" $PROD $TRIAGE
        fi
    - name: Add the results to the job summary
      if: always()
      shell: bash
      run: node "${{ github.action_path }}/scripts/job-summary.mjs" "${{ inputs.out }}"
    - name: Upload the reports
      if: always() && inputs.upload == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: testpion-results
        path: ${{ inputs.out }}
